name: Validate PDV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: node node_modules/typescript/bin/tsc

      - name: Project checks
        run: node scripts/test-blocks.mjs

      - name: Production build
        run: npm run build
