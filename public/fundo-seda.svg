<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!--
    Fundo Dr. Cafe: seda de cafe com leite.
    Cada onda da metade de baixo e montada em camadas para dar relevo e brilho:
      1. massa      - corpo do tecido, borda superior nitida
      2. oclusao    - sombra deslocada para baixo da curva
      3. halo       - luz larga rolando na superficie acima da dobra
      4. especular  - brilho quente e largo sobre a crista
      5. nucleo     - fio de luz fino e nitido (o que da o brilho)
      6. fios       - filetes paralelos finos, a textura da seda
      7. vinco      - linha escura nitida na borda do tecido
  -->
  <defs>
    <!-- geometria das ondas, reaproveitada por todas as camadas -->
    <path id="ondaA" d="M-60,508 C 250,590 468,688 700,704 C 932,720 1172,660 1500,544" />
    <path id="ondaB" d="M-60,738 C 262,684 518,796 760,812 C 1022,828 1260,756 1500,666" />
    <path id="ondaC" d="M-60,858 C 300,828 560,884 820,880 C 1080,876 1290,834 1500,782" />
    <path id="ondaD" d="M1118,912 C 1204,802 1298,766 1500,744" />
    <path id="ondaE" d="M-60,458 C 124,478 254,556 364,660 C 446,736 476,822 456,912" />

    <linearGradient id="base" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fdf6ea" />
      <stop offset="0.26" stop-color="#f8ead3" />
      <stop offset="0.52" stop-color="#efd9b2" />
      <stop offset="0.78" stop-color="#d4a56d" />
      <stop offset="1" stop-color="#a8733f" />
    </linearGradient>

    <!-- corpos de tecido: escuro no vale, claro ao subir para a crista -->
    <linearGradient id="massaA" x1="0.05" y1="0" x2="0.95" y2="0.45">
      <stop offset="0" stop-color="#9c6630" stop-opacity="0.85" />
      <stop offset="0.38" stop-color="#c28d4d" stop-opacity="0.5" />
      <stop offset="0.72" stop-color="#e2bd87" stop-opacity="0.28" />
      <stop offset="1" stop-color="#f3dcb6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="massaB" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#6f421c" stop-opacity="0.92" />
      <stop offset="0.42" stop-color="#a06c36" stop-opacity="0.62" />
      <stop offset="0.8" stop-color="#c99760" stop-opacity="0.3" />
      <stop offset="1" stop-color="#e0b782" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="massaC" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#4f2c11" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#7d4d23" stop-opacity="0.66" />
      <stop offset="1" stop-color="#a97442" stop-opacity="0.3" />
    </linearGradient>

    <!-- fio de luz nitido: o brilho principal da crista -->
    <linearGradient id="nucleo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0" />
      <stop offset="0.14" stop-color="#fffdf7" stop-opacity="0.75" />
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.58" stop-color="#fffaf0" stop-opacity="0.85" />
      <stop offset="0.82" stop-color="#fff6e6" stop-opacity="0.5" />
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0" />
    </linearGradient>

    <!-- brilho quente largo ao redor do fio de luz -->
    <linearGradient id="especular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4de" stop-opacity="0.06" />
      <stop offset="0.3" stop-color="#fff8e9" stop-opacity="0.62" />
      <stop offset="0.66" stop-color="#fff3dd" stop-opacity="0.42" />
      <stop offset="1" stop-color="#fff3dd" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2d9" stop-opacity="0.05" />
      <stop offset="0.42" stop-color="#fff8e9" stop-opacity="0.4" />
      <stop offset="1" stop-color="#fff2d9" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="vinco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d3f18" stop-opacity="0.06" />
      <stop offset="0.28" stop-color="#6d3f18" stop-opacity="0.7" />
      <stop offset="0.68" stop-color="#8d5c2c" stop-opacity="0.5" />
      <stop offset="1" stop-color="#8d5c2c" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="oclusao" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c3313" stop-opacity="0.6" />
      <stop offset="0.5" stop-color="#734519" stop-opacity="0.46" />
      <stop offset="1" stop-color="#96653a" stop-opacity="0.1" />
    </linearGradient>

    <!-- filetes finos da trama -->
    <linearGradient id="fioClaro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0" />
      <stop offset="0.3" stop-color="#fffdf8" stop-opacity="0.7" />
      <stop offset="0.7" stop-color="#fff8ea" stop-opacity="0.42" />
      <stop offset="1" stop-color="#fff8ea" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fioEscuro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d4d23" stop-opacity="0" />
      <stop offset="0.35" stop-color="#7d4d23" stop-opacity="0.34" />
      <stop offset="0.75" stop-color="#9a6531" stop-opacity="0.22" />
      <stop offset="1" stop-color="#9a6531" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="luzTopo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0.8" />
      <stop offset="0.55" stop-color="#fdf3e2" stop-opacity="0.22" />
      <stop offset="1" stop-color="#fdf3e2" stop-opacity="0" />
    </radialGradient>

    <filter id="b1" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="0.9" /></filter>
    <filter id="b3" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.6" /></filter>
    <filter id="b8" x="-20%" y="-150%" width="140%" height="400%"><feGaussianBlur stdDeviation="8" /></filter>
    <filter id="b18" x="-30%" y="-120%" width="160%" height="340%"><feGaussianBlur stdDeviation="18" /></filter>
    <filter id="b40" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="40" /></filter>
    <filter id="b70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70" /></filter>
  </defs>

  <rect width="1440" height="900" fill="url(#base)" />

  <!-- topo liso: so a luz difusa, como na referencia -->
  <ellipse cx="1060" cy="20" rx="800" ry="400" fill="url(#luzTopo)" filter="url(#b70)" />

  <!-- ==================== ONDA A: crista principal em S ==================== -->
  <path
    d="M-60,508 C 250,590 468,688 700,704 C 932,720 1172,660 1500,544 L1500,960 L-60,960 Z"
    fill="url(#massaA)"
    filter="url(#b8)"
  />
  <g fill="none" stroke-linecap="round">
    <use href="#ondaA" transform="translate(0,34)" stroke="url(#oclusao)" stroke-width="70" filter="url(#b40)" />
    <use href="#ondaA" transform="translate(0,-34)" stroke="url(#halo)" stroke-width="54" filter="url(#b18)" />
    <use href="#ondaA" transform="translate(0,-11)" stroke="url(#especular)" stroke-width="20" filter="url(#b8)" />
    <use href="#ondaA" transform="translate(0,-11)" stroke="url(#nucleo)" stroke-width="4.2" filter="url(#b1)" />
    <use href="#ondaA" transform="translate(6,-27)" stroke="url(#fioClaro)" stroke-width="1.8" filter="url(#b1)" />
    <use href="#ondaA" transform="translate(-8,-46)" stroke="url(#fioClaro)" stroke-width="1.4" filter="url(#b1)" opacity="0.7" />
    <use href="#ondaA" transform="translate(4,16)" stroke="url(#fioEscuro)" stroke-width="1.6" filter="url(#b1)" />
    <use href="#ondaA" stroke="url(#vinco)" stroke-width="2.2" filter="url(#b1)" />
  </g>

  <!-- ==================== ONDA B: onda larga do rodape ==================== -->
  <path
    d="M-60,738 C 262,684 518,796 760,812 C 1022,828 1260,756 1500,666 L1500,960 L-60,960 Z"
    fill="url(#massaB)"
    filter="url(#b8)"
  />
  <g fill="none" stroke-linecap="round">
    <use href="#ondaB" transform="translate(0,28)" stroke="url(#oclusao)" stroke-width="56" filter="url(#b40)" />
    <use href="#ondaB" transform="translate(0,-28)" stroke="url(#halo)" stroke-width="44" filter="url(#b18)" />
    <use href="#ondaB" transform="translate(0,-9)" stroke="url(#especular)" stroke-width="17" filter="url(#b8)" />
    <use href="#ondaB" transform="translate(0,-9)" stroke="url(#nucleo)" stroke-width="3.8" filter="url(#b1)" />
    <use href="#ondaB" transform="translate(6,-24)" stroke="url(#fioClaro)" stroke-width="1.6" filter="url(#b1)" />
    <use href="#ondaB" transform="translate(-6,-40)" stroke="url(#fioClaro)" stroke-width="1.2" filter="url(#b1)" opacity="0.65" />
    <use href="#ondaB" transform="translate(3,14)" stroke="url(#fioEscuro)" stroke-width="1.5" filter="url(#b1)" />
    <use href="#ondaB" stroke="url(#vinco)" stroke-width="2" filter="url(#b1)" />
  </g>

  <!-- ==================== ONDA C: vinco fundo no pe da tela ==================== -->
  <path
    d="M-60,858 C 300,828 560,884 820,880 C 1080,876 1290,834 1500,782 L1500,960 L-60,960 Z"
    fill="url(#massaC)"
    filter="url(#b8)"
  />
  <g fill="none" stroke-linecap="round">
    <use href="#ondaC" transform="translate(0,22)" stroke="url(#oclusao)" stroke-width="42" filter="url(#b18)" />
    <use href="#ondaC" transform="translate(0,-20)" stroke="url(#halo)" stroke-width="32" filter="url(#b18)" />
    <use href="#ondaC" transform="translate(0,-7)" stroke="url(#especular)" stroke-width="13" filter="url(#b8)" />
    <use href="#ondaC" transform="translate(0,-7)" stroke="url(#nucleo)" stroke-width="3.2" filter="url(#b1)" />
    <use href="#ondaC" transform="translate(5,-19)" stroke="url(#fioClaro)" stroke-width="1.3" filter="url(#b1)" opacity="0.8" />
    <use href="#ondaC" stroke="url(#vinco)" stroke-width="1.8" filter="url(#b1)" />
  </g>

  <!-- ==================== ONDA D: curva que sobe no canto direito ==================== -->
  <path d="M1118,912 C 1204,802 1298,766 1500,744 L1500,960 L1118,960 Z" fill="#f7e6c9" opacity="0.5" filter="url(#b18)" />
  <g fill="none" stroke-linecap="round">
    <use href="#ondaD" transform="translate(0,20)" stroke="url(#oclusao)" stroke-width="38" filter="url(#b18)" />
    <use href="#ondaD" transform="translate(0,-18)" stroke="url(#halo)" stroke-width="28" filter="url(#b18)" />
    <use href="#ondaD" transform="translate(0,-7)" stroke="url(#especular)" stroke-width="14" filter="url(#b8)" />
    <use href="#ondaD" transform="translate(0,-7)" stroke="url(#nucleo)" stroke-width="3.4" filter="url(#b1)" />
    <use href="#ondaD" transform="translate(4,-20)" stroke="url(#fioClaro)" stroke-width="1.3" filter="url(#b1)" opacity="0.75" />
    <use href="#ondaD" stroke="url(#vinco)" stroke-width="1.8" filter="url(#b1)" />
  </g>

  <!-- ============= ONDA E: vinco diagonal descendo pela esquerda ============= -->
  <g fill="none" stroke-linecap="round">
    <use href="#ondaE" transform="translate(24,12)" stroke="url(#oclusao)" stroke-width="50" filter="url(#b40)" />
    <use href="#ondaE" transform="translate(-28,-14)" stroke="url(#halo)" stroke-width="38" filter="url(#b18)" />
    <use href="#ondaE" transform="translate(-9,-5)" stroke="url(#especular)" stroke-width="13" filter="url(#b8)" />
    <use href="#ondaE" transform="translate(-9,-5)" stroke="url(#nucleo)" stroke-width="3" filter="url(#b1)" />
    <use href="#ondaE" transform="translate(-24,-13)" stroke="url(#fioClaro)" stroke-width="1.3" filter="url(#b1)" opacity="0.7" />
    <use href="#ondaE" stroke="url(#vinco)" stroke-width="2" filter="url(#b1)" />
  </g>

  <!-- sombra quente do canto inferior esquerdo -->
  <ellipse cx="-20" cy="892" rx="480" ry="280" fill="#67391a" opacity="0.42" filter="url(#b70)" />

  <!-- clarao sedoso logo acima da crista principal -->
  <ellipse cx="880" cy="430" rx="560" ry="150" fill="#fff9ec" opacity="0.26" filter="url(#b70)" />
</svg>
